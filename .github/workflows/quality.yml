name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run quality checks
        id: quality
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test.log
          TEST_STATUS=${PIPESTATUS[0]}

          npm run lint 2>&1 | tee lint.log
          LINT_STATUS=${PIPESTATUS[0]}

          npm run typecheck 2>&1 | tee typecheck.log
          TYPECHECK_STATUS=${PIPESTATUS[0]}

          npm run build 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}

          printf 'test=%s\nlint=%s\ntypecheck=%s\nbuild=%s\n' "$TEST_STATUS" "$LINT_STATUS" "$TYPECHECK_STATUS" "$BUILD_STATUS" | tee summary.log

          if [ "$TEST_STATUS" -ne 0 ] || [ "$LINT_STATUS" -ne 0 ] || [ "$TYPECHECK_STATUS" -ne 0 ] || [ "$BUILD_STATUS" -ne 0 ]; then
            exit 1
          fi

      - name: Upload quality logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-logs
          path: |
            test.log
            lint.log
            typecheck.log
            build.log
            summary.log
          if-no-files-found: warn
